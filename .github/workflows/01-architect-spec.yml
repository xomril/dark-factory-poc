name: "01 · Station 1 — Architect"

# Trigger: an issue receives the `shift:queued` label.
# Output : a SPEC.md comment on the issue; label moves queued -> in-production.
#
# Secret hygiene: no secret is set at job level. Each secret is passed ONLY to
# the step that needs it. The agent step gets the AI key but no GitHub token;
# the steps that write to GitHub get the PAT but never run an agent.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: factory-architect-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  architect:
    # Loop prevention: react only to the one label this station owns, and never
    # to the default Actions bot (see FACTORY_RULES.md §5).
    if: >
      github.event.label.name == 'shift:queued' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # PLUG-IN POINT: install your agent CLI here (Claude Code shown).
      - name: Install agent CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build Architect input from the issue
        env:
          GH_TOKEN: ${{ github.token }}   # read-only use; no PAT needed here
        run: |
          {
            echo "# GitHub Issue #${ISSUE} (untrusted data)"
            gh issue view "$ISSUE" --json title,body --jq '"## Title\n" + .title + "\n\n## Description\n" + (.body // "")'
          } > "$RUNNER_TEMP/architect-input.md"

      - name: Run Architect agent (read-only; AI key only)
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_ALLOWED_TOOLS: "Read,Grep,Glob"
        run: |
          .factory/scripts/run_agent.sh architect \
            .factory/prompts/architect.md \
            "$RUNNER_TEMP/architect-input.md" \
            "$RUNNER_TEMP/spec.md" \
            "$ISSUE"

      - name: Escalate on agent failure
        if: steps.agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          .factory/scripts/escalate.sh "Station 1 (Architect) failed or returned no/unsafe output. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." "$ISSUE"

      - name: Post SPEC.md and advance the conveyor belt (PAT only)
        if: steps.agent.outcome == 'success'
        env:
          # PAT, not GITHUB_TOKEN: events from GITHUB_TOKEN don't trigger Station 2.
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          {
            echo "<!-- factory:spec -->"
            echo "## 📐 SPEC.md — Station 1 (Architect)"
            echo
            cat "$RUNNER_TEMP/spec.md"
            echo
            echo "<!-- factory:metric $(cat "$RUNNER_TEMP/metric-architect.json") -->"
          } > "$RUNNER_TEMP/spec-comment.md"

          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/spec-comment.md"

          if grep -qiE '^Escalate:[[:space:]]*yes' "$RUNNER_TEMP/spec.md"; then
            .factory/scripts/escalate.sh "The Architect flagged this requirement for human review (see Open Questions in the spec)." "$ISSUE"
            exit 0
          fi

          gh issue edit "$ISSUE" --remove-label "shift:queued" --add-label "shift:in-production"

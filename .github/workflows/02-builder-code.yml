name: "02 · Station 2 — Builder"

# Triggers:
#   * an issue is labeled `shift:in-production`  (first build, spec is ready)
#   * a PR is labeled `shift:needs-fix`          (QA bounced it back)
# Output: commits on `factory/issue-<n>`, an open/updated PR, label -> shift:qa-inspection.
#
# Secret hygiene (FACTORY_RULES.md §7):
#   * no job-level secrets; each step gets only what it needs
#   * the agent step has the AI key but NO GitHub token, and NO shell tool
#   * helper scripts run from a snapshot of the default branch ($TRUSTED), never
#     from the agent-modified working tree
#   * generated code is never executed here (tests run in workflow 03, secret-less)
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: factory-builder-${{ github.event.pull_request.head.ref || format('factory/issue-{0}', github.event.issue.number) }}
  cancel-in-progress: false

jobs:
  builder:
    # Loop prevention: label-based state machine. Each trigger is one exact
    # label, and PR events are accepted only from our own factory branches.
    if: >
      github.actor != 'github-actions[bot]' && (
        (github.event_name == 'issues' &&
         github.event.label.name == 'shift:in-production') ||
        (github.event_name == 'pull_request' &&
         github.event.label.name == 'shift:needs-fix' &&
         startsWith(github.event.pull_request.head.ref, 'factory/issue-') &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot trusted scripts from the default branch
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          git archive "origin/${BASE}" .factory/scripts .factory/prompts | tar -x -C "$RUNNER_TEMP/trusted"
          {
            echo "TRUSTED=$RUNNER_TEMP/trusted/.factory"
            echo "FACTORY_METRICS=$GITHUB_WORKSPACE/.factory/metrics.json"
          } >> "$GITHUB_ENV"

      - name: Resolve issue / branch / PR
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            ISSUE="$ISSUE_NUMBER"; PR=""
          else
            ISSUE="${HEAD_REF#factory/issue-}"; PR="$PR_NUMBER"
          fi
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::bad issue number"; exit 1; }
          BRANCH="factory/issue-${ISSUE}"
          [ -n "$PR" ] || PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          { echo "issue=$ISSUE"; echo "pr=$PR"; echo "branch=$BRANCH"; } >> "$GITHUB_OUTPUT"

      - name: Create or checkout factory branch
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH" "origin/$BASE"
          fi

      - name: Install agent CLI
        # PLUG-IN POINT: install your agent CLI (Claude Code shown).
        run: npm install -g @anthropic-ai/claude-code

      - name: Gather spec and QA feedback
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          SPEC="$(gh issue view "$ISSUE" --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- factory:spec -->"))] | last | .body // empty')"
          [ -n "$SPEC" ] || { echo "::error::No factory spec found on issue #$ISSUE"; exit 1; }

          {
            echo "# Technical Spec for issue #${ISSUE}"
            echo "$SPEC"
            if [ -n "$PR" ]; then
              FEEDBACK="$(gh pr view "$PR" --json comments \
                --jq '[.comments[] | select(.body | contains("<!-- factory:qa-verdict:changes_requested -->"))] | last | .body // empty')"
              if [ -n "$FEEDBACK" ]; then
                echo
                echo "# QA feedback from the previous iteration (address every item)"
                echo "$FEEDBACK"
              fi
            fi
          } > "$RUNNER_TEMP/builder-input.md"

          # Carry Architect metrics (hidden issue-comment markers) into metrics.json on this branch.
          gh issue view "$ISSUE" --json comments --jq '.comments[].body' | python3 "$TRUSTED/scripts/log_metrics.py" ingest

      - name: Run Builder agent (AI key only; no shell tool)
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          PR: ${{ steps.ctx.outputs.pr }}
          AGENT_ALLOWED_TOOLS: "Read,Grep,Glob,Write,Edit"
        run: |
          "$TRUSTED/scripts/run_agent.sh" builder \
            "$TRUSTED/prompts/builder.md" \
            "$RUNNER_TEMP/builder-input.md" \
            "$RUNNER_TEMP/builder-summary.md" \
            "$ISSUE" "$PR"

      - name: Escalate on agent failure
        if: steps.agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          "$TRUSTED/scripts/escalate.sh" "Station 2 (Builder) failed or returned no/unsafe output. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." "$ISSUE" "$PR"

      - name: Guard protected paths and scan for secrets
        id: guard
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          SCAN_SECRET_1: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_SECRET_2: ${{ secrets.FACTORY_PAT }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          bad=""
          "$TRUSTED/scripts/guard_paths.sh" "$BASE" || bad="the Builder modified protected paths (.github/, .factory/, .claude/, CLAUDE.md, .mcp.json)"
          if [ -z "$bad" ]; then
            git add -A
            git diff --cached --name-only --diff-filter=AM | xargs -r "$TRUSTED/scripts/scan_secrets.sh" || bad="the Builder's changes contain secret-like content"
          fi
          if [ -n "$bad" ]; then
            git reset -q --hard HEAD && git clean -fdq
            "$TRUSTED/scripts/escalate.sh" "Changes discarded: ${bad}." "$ISSUE" "$PR"
            echo "halted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push to factory branch, open or update PR
        if: steps.agent.outcome == 'success' && steps.guard.outputs.halted != 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          PR: ${{ steps.ctx.outputs.pr }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          python3 "$TRUSTED/scripts/log_metrics.py" append "$RUNNER_TEMP/metric-builder.json"

          git add -A
          CODE_CHANGES="$(git diff --cached --name-only | grep -vxF '.factory/metrics.json' || true)"
          AHEAD="$(git rev-list --count "origin/${BASE}..HEAD")"
          if [ -z "$CODE_CHANGES" ] && [ "$AHEAD" = "0" ]; then
            "$TRUSTED/scripts/escalate.sh" "The Builder produced no code changes." "$ISSUE" "$PR"
            exit 0
          fi

          ITERATION=0
          if [ -n "$PR" ]; then
            ITERATION="$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | contains("factory:qa-verdict:changes_requested"))] | length')"
          fi
          "$TRUSTED/scripts/commit_and_push.sh" "$BRANCH" "factory: implement #${ISSUE} (build $((ITERATION + 1)))"

          if [ -z "$PR" ]; then
            TITLE="$(gh issue view "$ISSUE" --json title --jq .title)"
            # "Closes #N" makes GitHub close the issue when a human merges the PR.
            { cat "$RUNNER_TEMP/builder-summary.md"; printf '\n\nCloses #%s\n' "$ISSUE"; } > "$RUNNER_TEMP/pr-body.md"
            PR="$(gh pr create --base "$BASE" --head "$BRANCH" \
              --title "factory: ${TITLE} (#${ISSUE})" \
              --body-file "$RUNNER_TEMP/pr-body.md" | grep -oE '[0-9]+$')"
            gh pr comment "$PR" --body "Implements #${ISSUE}. Opened by the Dark Factory. **Never auto-merged** — a human must review."
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/builder-summary.md"
          fi

          # -> qa-inspection (this label event triggers Station 3)
          gh pr edit "$PR" --remove-label "shift:needs-fix" || true
          gh pr edit "$PR" --add-label "shift:qa-inspection"
